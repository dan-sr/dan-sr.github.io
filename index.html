<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Remates — El Heraldo</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0f4ff; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const COLONIAS_DEFAULT = ["Miraflores", "Miramontes", "Kennedy", "Hato de Enmedio", "Las Lomas"];

    const SYSTEM_PROMPT = `Eres un asistente especializado en analizar páginas del Diario El Heraldo de Honduras.

INSTRUCCIONES:

1. Busca CUALQUIER aviso que diga "Convocatoria de Subasta", "Remate Judicial" o "Aviso de Remate"
1. Extrae la fecha de publicación del encabezado del periódico (ej: "Miércoles 20 de mayo de 2026")
1. Para CADA remate encontrado extrae:
- colonia: colonia donde está la propiedad
- departamento: departamento de Honduras
- fecha_remate: fecha exacta del remate programado
- fecha_publicacion: fecha del periódico del encabezado
- pagina: número de página del periódico
- propiedad: descripción del inmueble
- demanda: tipo de demanda
- juzgado: juzgado que convoca
- detalles: banco ejecutante u otros datos

RESPONDE SOLO CON JSON puro, sin texto extra, sin bloques markdown:
{
"fecha_publicacion": "fecha del encabezado",
"pagina": "número de página",
"tiene_remates": true,
"remates": [
{
"colonia": "nombre colonia",
"departamento": "departamento",
"fecha_remate": "fecha del remate",
"propiedad": "descripción inmueble",
"demanda": "tipo de demanda",
"juzgado": "nombre juzgado",
"detalles": "otros detalles"
}
],
"notas": "observación"
}

Si no hay remates: {"tiene_remates": false, "remates": [], "fecha_publicacion": "fecha si aparece", "pagina": null, "notas": "razón"}`;

    const C = {
      bg: "#f0f4ff", primary: "#2563eb", primaryLight: "#dbeafe",
      success: "#16a34a", successLight: "#dcfce7", successBorder: "#86efac",
      comment: "#92400e", commentLight: "#fef3c7", commentBorder: "#fcd34d",
      grayLight: "#f3f4f6", border: "#e5e7eb", text: "#111827",
      textMuted: "#6b7280", danger: "#dc2626", dangerLight: "#fee2e2", header: "#1e3a8a",
    };

    function convertirAJpeg(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = img.width;
          canvas.height = img.height;
          canvas.getContext("2d").drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
          resolve({ name: file.name, data: dataUrl.split(",")[1], type: "image/jpeg" });
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("No se pudo leer la imagen")); };
        img.src = url;
      });
    }

    function Campo({ label, valor, highlight }) {
      if (!valor) return null;
      return (
        <div style={{ marginBottom: "6px", display: "flex", gap: "8px", flexWrap: "wrap", alignItems: "flex-start" }}>
          <span style={{ fontWeight: "600", color: C.textMuted, fontSize: "13px", minWidth: "165px", flexShrink: 0 }}>{label}</span>
          <span style={{ fontSize: "13px", color: highlight ? C.primary : C.text, fontWeight: highlight ? "700" : "400", flex: 1 }}>{valor}</span>
        </div>
      );
    }

    function RematesHeraldo() {
      const [colonias, setColonias] = useState(COLONIAS_DEFAULT);
      const [nuevaColonia, setNuevaColonia] = useState("");
      const [rematesInteres, setRematesInteres] = useState([]);
      const [rematesOtros, setRematesOtros] = useState([]);
      const [analizando, setAnalizando] = useState(false);
      const [error, setError] = useState(null);
      const [errorDetalle, setErrorDetalle] = useState(null);
      const [imagenes, setImagenes] = useState([]);
      const [progreso, setProgreso] = useState("");
      const [tab, setTab] = useState("buscar");

      const agregarColonia = () => {
        const c = nuevaColonia.trim();
        if (c && !colonias.includes(c)) { setColonias(prev => [...prev, c]); setNuevaColonia(""); }
      };

      const quitarColonia = (c) => setColonias(prev => prev.filter(x => x !== c));

      const handleImagenes = async (e) => {
        const files = Array.from(e.target.files);
        try {
          const convertidas = await Promise.all(files.map(f => convertirAJpeg(f)));
          setImagenes(convertidas);
        } catch (err) {
          setError("Error al leer las imágenes: " + err.message);
        }
      };

      const analizarImagenes = async () => {
        if (imagenes.length === 0) { setError("Por favor sube al menos una imagen."); return; }

        setAnalizando(true);
        setError(null);
        setErrorDetalle(null);
        setRematesInteres([]);
        setRematesOtros([]);

        const coloniasActuales = colonias;
        const interes = [];
        const otros = [];

        for (let i = 0; i < imagenes.length; i++) {
          const img = imagenes[i];
          setProgreso(`Analizando imagen ${i + 1} de ${imagenes.length}...`);

          let response, data;

          try {
            response = await fetch("https://api.anthropic.com/v1/messages", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "anthropic-dangerous-direct-browser-calls": "true"
              },
              body: JSON.stringify({
                model: "claude-sonnet-4-20250514",
                max_tokens: 2000,
                system: SYSTEM_PROMPT,
                messages: [{
                  role: "user",
                  content: [
                    { type: "image", source: { type: "base64", media_type: "image/jpeg", data: img.data } },
                    { type: "text", text: "Analiza esta página de El Heraldo. Extrae la fecha del encabezado y TODOS los avisos de convocatoria de subasta o remate judicial. Responde SOLO con JSON puro." }
                  ]
                }]
              })
            });
          } catch (err) {
            setErrorDetalle(`Error de red en imagen ${i + 1}: ${err.message}`);
            continue;
          }

          if (!response.ok) {
            const txt = await response.text();
            setErrorDetalle(`Error HTTP ${response.status} en imagen ${i + 1}: ${txt.substring(0, 300)}`);
            continue;
          }

          try {
            data = await response.json();
          } catch (err) {
            setErrorDetalle(`Error al leer respuesta JSON de imagen ${i + 1}: ${err.message}`);
            continue;
          }

          if (data.error) {
            setErrorDetalle(`Error de API: ${data.error.message}`);
            continue;
          }

          const textoRespuesta = data.content?.find(b => b.type === "text")?.text || "";
          let parsed = null;
          try {
            const match = textoRespuesta.match(/\{[\s\S]*\}/);
            if (match) parsed = JSON.parse(match[0]);
          } catch (err) {
            setErrorDetalle(`No se pudo leer el JSON de imagen ${i + 1}. Respuesta recibida: ${textoRespuesta.substring(0, 200)}`);
            continue;
          }

          if (!parsed) { setErrorDetalle(`Respuesta vacía de imagen ${i + 1}`); continue; }

          const fechaPublicacion = parsed.fecha_publicacion || "";
          const pagina = parsed.pagina || "";

          if (parsed.tiene_remates && Array.isArray(parsed.remates) && parsed.remates.length > 0) {
            parsed.remates.forEach(r => {
              const entry = { ...r, fecha_publicacion: r.fecha_publicacion || fechaPublicacion, pagina: r.pagina || pagina };
              const txt = ((r.colonia || "") + " " + (r.propiedad || "") + " " + (r.detalles || "")).toLowerCase();
              const esInteres = coloniasActuales.some(c => txt.includes(c.toLowerCase()));
              if (esInteres) interes.push(entry); else otros.push(entry);
            });
          }
        }

        setRematesInteres(interes);
        setRematesOtros(otros);
        setProgreso("");
        setAnalizando(false);

        if (interes.length === 0 && otros.length === 0 && !errorDetalle) {
          setError("No se encontraron avisos de remate o subasta en las páginas analizadas.");
        } else if (interes.length > 0 || otros.length > 0) {
          setTab("resultados");
        }
      };

      const total = rematesInteres.length + rematesOtros.length;

      return (
        <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'Segoe UI', system-ui, sans-serif", color: C.text }}>

          {/* Header */}
          <div style={{ background: C.header, padding: "18px 24px", boxShadow: "0 2px 8px rgba(0,0,0,0.2)" }}>
            <div style={{ maxWidth: "900px", margin: "0 auto", display: "flex", alignItems: "center", gap: "14px" }}>
              <span style={{ fontSize: "36px" }}>⚖️</span>
              <div>
                <div style={{ fontSize: "20px", fontWeight: "700", color: "#fff" }}>Buscador de Remates Judiciales</div>
                <div style={{ fontSize: "13px", color: "#93c5fd" }}>Diario El Heraldo · Honduras</div>
              </div>
            </div>
          </div>

          {/* Tabs */}
          <div style={{ background: "#fff", borderBottom: `2px solid ${C.border}` }}>
            <div style={{ maxWidth: "900px", margin: "0 auto", display: "flex" }}>
              {[{ key: "buscar", label: "🔍 Buscar" }, { key: "resultados", label: `📋 Resultados${total > 0 ? ` (${total})` : ""}` }].map(t => (
                <button key={t.key} onClick={() => setTab(t.key)} style={{
                  padding: "14px 28px", background: "none", border: "none", cursor: "pointer", fontSize: "14px",
                  fontWeight: "600", color: tab === t.key ? C.primary : C.textMuted,
                  borderBottom: tab === t.key ? `3px solid ${C.primary}` : "3px solid transparent", transition: "all 0.2s"
                }}>{t.label}</button>
              ))}
            </div>
          </div>

          <div style={{ maxWidth: "900px", margin: "0 auto", padding: "24px 16px" }}>

            {/* ===== BUSCAR ===== */}
            {tab === "buscar" && (
              <div style={{ display: "flex", flexDirection: "column", gap: "20px" }}>

                {/* Colonias */}
                <div style={{ background: "#fff", borderRadius: "12px", padding: "20px", boxShadow: "0 1px 4px rgba(0,0,0,0.08)", border: `1px solid ${C.border}` }}>
                  <div style={{ fontWeight: "700", fontSize: "15px", color: C.header, marginBottom: "4px" }}>🏘️ Colonias de Interés</div>
                  <div style={{ fontSize: "12px", color: C.textMuted, marginBottom: "14px" }}>Las subastas en estas colonias aparecerán destacadas con ✅</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: "8px", marginBottom: "14px" }}>
                    {colonias.map(c => (
                      <span key={c} style={{ background: C.primaryLight, border: `1px solid #93c5fd`, borderRadius: "20px", padding: "5px 12px 5px 14px", fontSize: "13px", color: C.primary, display: "flex", alignItems: "center", gap: "8px", fontWeight: "500" }}>
                        {c}
                        <span onClick={() => quitarColonia(c)} style={{ cursor: "pointer", color: C.danger, fontWeight: "700", fontSize: "15px", width: "18px", height: "18px", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: "50%", background: C.dangerLight }}>×</span>
                      </span>
                    ))}
                  </div>
                  <div style={{ display: "flex", gap: "8px" }}>
                    <input value={nuevaColonia} onChange={e => setNuevaColonia(e.target.value)} onKeyDown={e => e.key === "Enter" && agregarColonia()} placeholder="Escribir colonia y presionar Enter..." style={{ flex: 1, border: `1px solid ${C.border}`, borderRadius: "8px", padding: "9px 14px", fontSize: "14px", outline: "none", background: C.grayLight }} />
                    <button onClick={agregarColonia} style={{ background: C.primary, color: "#fff", border: "none", borderRadius: "8px", padding: "9px 18px", cursor: "pointer", fontSize: "14px", fontWeight: "600" }}>+ Agregar</button>
                  </div>
                </div>

                {/* Subir imágenes */}
                <div style={{ background: "#fff", borderRadius: "12px", padding: "32px", border: `2px dashed #93c5fd`, textAlign: "center" }}>
                  <div style={{ fontSize: "48px", marginBottom: "10px" }}>📰</div>
                  <div style={{ fontWeight: "700", fontSize: "16px", color: C.header, marginBottom: "6px" }}>Sube las páginas del periódico</div>
                  <div style={{ fontSize: "13px", color: C.textMuted, marginBottom: "20px" }}>
                    Capturas de las páginas de avisos legales (página 20 en adelante).<br />
                    <strong>La fecha se extrae automáticamente del encabezado.</strong><br />
                    <span style={{ color: C.success }}>✓ Se aceptan fotos de iPhone, Android, PNG, JPG</span>
                  </div>
                  <input type="file" accept="image/*" multiple onChange={handleImagenes} style={{ display: "none" }} id="file-input" />
                  <label htmlFor="file-input" style={{ background: C.primary, color: "#fff", padding: "11px 28px", borderRadius: "8px", cursor: "pointer", fontSize: "14px", fontWeight: "600", display: "inline-block" }}>📎 Seleccionar Imágenes</label>
                  {imagenes.length > 0 && (
                    <div style={{ marginTop: "16px", color: C.success, fontWeight: "600", fontSize: "14px" }}>
                      ✓ {imagenes.length} imagen{imagenes.length > 1 ? "es" : ""} lista{imagenes.length > 1 ? "s" : ""}
                      {imagenes.map(img => <div key={img.name} style={{ fontSize: "12px", color: C.textMuted, fontWeight: "400" }}>{img.name}</div>)}
                    </div>
                  )}
                </div>

                {error && <div style={{ background: C.dangerLight, border: `1px solid #fca5a5`, borderRadius: "8px", padding: "14px", color: C.danger, fontSize: "14px" }}>⚠️ {error}</div>}
                {errorDetalle && <div style={{ background: "#fff7ed", border: `1px solid #fed7aa`, borderRadius: "8px", padding: "14px", fontSize: "12px", color: "#9a3412", wordBreak: "break-all" }}>🔧 {errorDetalle}</div>}

                <button onClick={analizarImagenes} disabled={analizando || imagenes.length === 0} style={{
                  background: analizando || imagenes.length === 0 ? "#9ca3af" : C.primary,
                  color: "#fff", border: "none", borderRadius: "10px", padding: "15px", fontSize: "16px",
                  fontWeight: "700", cursor: analizando || imagenes.length === 0 ? "not-allowed" : "pointer",
                  boxShadow: analizando ? "none" : "0 4px 12px rgba(37,99,235,0.35)", transition: "all 0.2s"
                }}>
                  {analizando ? `⏳ ${progreso}` : "🔍 ANALIZAR PÁGINAS"}
                </button>
              </div>
            )}

            {/* ===== RESULTADOS ===== */}
            {tab === "resultados" && (
              <div style={{ display: "flex", flexDirection: "column", gap: "28px" }}>

                {/* Colonias de interés */}
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "14px" }}>
                    <span style={{ fontSize: "20px" }}>✅</span>
                    <span style={{ fontWeight: "700", fontSize: "17px", color: C.success }}>REMATES EN COLONIAS DE INTERÉS</span>
                    <span style={{ background: C.successLight, color: C.success, border: `1px solid ${C.successBorder}`, borderRadius: "12px", padding: "2px 12px", fontSize: "13px", fontWeight: "600" }}>{rematesInteres.length} encontrado{rematesInteres.length !== 1 ? "s" : ""}</span>
                  </div>
                  {rematesInteres.length === 0 ? (
                    <div style={{ background: C.grayLight, borderRadius: "10px", padding: "20px", color: C.textMuted, fontSize: "14px", textAlign: "center", border: `1px solid ${C.border}` }}>No se encontraron subastas en las colonias de interés.</div>
                  ) : (
                    <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
                      {rematesInteres.map((r, i) => (
                        <div key={i} style={{ background: "#fff", borderRadius: "12px", padding: "20px", border: `1px solid ${C.successBorder}`, borderLeft: `5px solid ${C.success}`, boxShadow: "0 2px 8px rgba(22,163,74,0.08)" }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "14px", flexWrap: "wrap", gap: "8px" }}>
                            <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                              <span style={{ background: C.successLight, color: C.success, borderRadius: "6px", padding: "3px 10px", fontSize: "12px", fontWeight: "700" }}>✅ COLONIA DE INTERÉS</span>
                              <span style={{ fontWeight: "700", fontSize: "16px", color: C.success }}>Colonia {r.colonia || "—"}</span>
                            </div>
                            <span style={{ background: C.primaryLight, color: C.primary, borderRadius: "6px", padding: "3px 10px", fontSize: "12px", fontWeight: "600" }}>Página {r.pagina || "—"}</span>
                          </div>
                          <div style={{ background: C.grayLight, borderRadius: "8px", padding: "14px" }}>
                            <Campo label="📅 Fecha del Remate:" valor={r.fecha_remate} highlight />
                            <Campo label="📰 Fecha de Publicación:" valor={r.fecha_publicacion} />
                            <Campo label="🏠 Propiedad:" valor={r.propiedad} />
                            <Campo label="⚖️ Juzgado:" valor={r.juzgado} />
                            <Campo label="📄 Demanda:" valor={r.demanda} />
                            <Campo label="📍 Departamento:" valor={r.departamento ? `${r.departamento}, Honduras` : null} />
                            {r.detalles && <div style={{ marginTop: "8px", paddingTop: "8px", borderTop: `1px solid ${C.border}`, fontSize: "12px", color: C.textMuted }}>💬 {r.detalles}</div>}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Otras colonias */}
                {rematesOtros.length > 0 && (
                  <div>
                    <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "14px" }}>
                      <span style={{ fontSize: "20px" }}>📝</span>
                      <span style={{ fontWeight: "700", fontSize: "17px", color: C.comment }}>COMENTARIOS — Otras Colonias</span>
                      <span style={{ background: C.commentLight, color: C.comment, border: `1px solid ${C.commentBorder}`, borderRadius: "12px", padding: "2px 12px", fontSize: "13px", fontWeight: "600" }}>{rematesOtros.length}</span>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                      {rematesOtros.map((r, i) => (
                        <div key={i} style={{ background: "#fff", borderRadius: "10px", padding: "16px", border: `1px solid ${C.commentBorder}`, borderLeft: `4px solid #f59e0b` }}>
                          <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: "6px", marginBottom: "10px" }}>
                            <span style={{ fontWeight: "700", fontSize: "15px", color: C.comment }}>Colonia {r.colonia || "—"}</span>
                            <span style={{ fontSize: "12px", color: C.textMuted, background: C.grayLight, borderRadius: "6px", padding: "2px 8px" }}>Página {r.pagina || "—"}</span>
                          </div>
                          <Campo label="📅 Fecha Remate:" valor={r.fecha_remate} highlight />
                          <Campo label="📰 Publicación:" valor={r.fecha_publicacion} />
                          <Campo label="🏠 Propiedad:" valor={r.propiedad} />
                          <Campo label="📍 Depto.:" valor={r.departamento ? `${r.departamento}, Honduras` : null} />
                          {r.juzgado && <Campo label="⚖️ Juzgado:" valor={r.juzgado} />}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Conclusión */}
                <div style={{ background: C.primaryLight, borderRadius: "12px", padding: "18px 20px", border: `1px solid #93c5fd` }}>
                  <div style={{ fontWeight: "700", fontSize: "15px", color: C.header, marginBottom: "10px" }}>📌 CONCLUSIÓN</div>
                  <div style={{ fontSize: "14px", color: C.text, lineHeight: "1.7" }}>
                    {rematesInteres.length > 0
                      ? `✅ Se encontraron ${rematesInteres.length} remate${rematesInteres.length > 1 ? "s" : ""} en colonias de interés: ${rematesInteres.map(r => r.colonia).join(", ")}.`
                      : "⚪ No se encontraron remates en las colonias de interés en esta edición."}
                    {rematesOtros.length > 0 && ` Además se detectaron ${rematesOtros.length} aviso${rematesOtros.length > 1 ? "s" : ""} en otras colonias.`}
                  </div>
                </div>

                <button onClick={() => {
                  const rows = [
                    ["Tipo", "Colonia", "Fecha Remate", "Fecha Publicación", "Propiedad", "Juzgado", "Demanda", "Departamento", "Página", "Detalles"],
                    ...rematesInteres.map(r => ["INTERÉS ✅", r.colonia||"", r.fecha_remate||"", r.fecha_publicacion||"", r.propiedad||"", r.juzgado||"", r.demanda||"", r.departamento||"", r.pagina||"", r.detalles||""]),
                    ...rematesOtros.map(r => ["Otra colonia", r.colonia||"", r.fecha_remate||"", r.fecha_publicacion||"", r.propiedad||"", r.juzgado||"", r.demanda||"", r.departamento||"", r.pagina||"", r.detalles||""])
                  ];
                  const csv = rows.map(r => r.map(c => `"${c}"`).join(",")).join("\n");
                  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement("a"); a.href = url; a.download = "remates_heraldo.csv"; a.click();
                }} style={{ background: "#fff", color: C.primary, border: `1px solid ${C.primary}`, borderRadius: "8px", padding: "10px 20px", cursor: "pointer", fontSize: "14px", fontWeight: "600", alignSelf: "flex-start" }}>
                  ⬇️ Descargar CSV
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RematesHeraldo />);
  </script>
</body>
</html>
